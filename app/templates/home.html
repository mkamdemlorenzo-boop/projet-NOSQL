<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeux</title>
</head>
<body>

<button id="addGame">Ajouter un jeu</button>

<script>
    document.getElementById("addGame").addEventListener("click", async () => {

    const response = await fetch("/game", {
        method: "POST"
    });

    const message = await response.text();

    alert(message);
});
</script>

</body>
</html>

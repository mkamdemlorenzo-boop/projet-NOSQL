services:
  node:
    image: gameproj
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mongodb
      - redis
      - neo4j
      
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: game
      MYSQL_DATABASE: gameproj
      MYSQL_USER: game
      MYSQL_PASSWORD: game
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugame", "-pgame"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    volumes:
      - streamflix-mysql:/var/lib/mysql

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - streamflix-mongodb:/data/db

  redis:
    image: redis:8.6.4-trixie
    ports:
      - "6379:6379"
    volumes:
      - streamflix-redis:/data
    
  neo4j:
    image: neo4j:5.26.28
    ports:
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/streamflix
    volumes:
      - streamflix-neo4j:/data

volumes:
  streamflix-mongodb:
  streamflix-redis:
  streamflix-neo4j:
  streamflix-mysql:
